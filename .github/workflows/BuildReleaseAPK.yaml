name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove Aliyun Maven
        run: |
          grep -R "maven.aliyun.com" . || true
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i \
            's#https://maven.aliyun.com/repository/google#https://dl.google.com/dl/android/maven2#g' {} \;
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i \
            's#https://maven.aliyun.com/repository/public#https://repo1.maven.org/maven2#g' {} \;

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGplayRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: element-release
          path: vector-app/build/outputs/apk/**/*.apk
