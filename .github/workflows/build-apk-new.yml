name: Build APK (Release Signed)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Replace Aliyun Maven Mirrors
        run: |
          echo "=== Find aliyun mirrors ==="
          grep -R "maven.aliyun.com" . || true

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            -exec sed -i 's#https://maven.aliyun.com/repository/google#https://dl.google.com/dl/android/maven2#g' {} \;

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            -exec sed -i 's#https://maven.aliyun.com/repository/public#https://repo.maven.apache.org/maven2#g' {} \;

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            -exec sed -i 's#https://maven.aliyun.com/repository/gradle-plugin#https://plugins.gradle.org/m2#g' {} \;

          echo "=== After replace ==="
          grep -R "maven.aliyun.com" . || true

      - name: Remove old MaxPermSize
        run: |
          find . -type f \( -name "*.properties" -o -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i 's/-XX:MaxPermSize=[^ ]*//g' {} \;

      - name: Configure Release with Debug Signing
        run: |
          # Enable debug signing for release build type so APK can be installed directly
          sed -i '/buildTypes {/,/^    }/s/release {/release {\n            signingConfig signingConfigs.debug/' vector-app/build.gradle

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGplayRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: element-release-signed
          path: |
            vector-app/build/outputs/apk/**/*.apk
